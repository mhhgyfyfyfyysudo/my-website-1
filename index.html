<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f5"><title>A Little Something For You ♡</title>
<style>
:root{--pink:#f6a9c4;--deep:#d85d8d;--ink:#71465a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:linear-gradient(145deg,#fff8fb,#ffe8f1 55%,#fff5f8);overflow-x:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.heart{position:absolute;bottom:-30px;color:#ee9dbb;opacity:.55;animation:floatUp linear forwards}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(100%,520px);min-height:470px;padding:clamp(26px,6vw,48px);border:1px solid #f7c9d9;border-radius:28px;background:rgba(255,255,255,.82);box-shadow:0 18px 55px #c56e8b22;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.card:before,.card:after{content:"♡";position:absolute;color:#f5c0d2;font-size:36px;opacity:.65}.card:before{top:18px;left:22px}.card:after{bottom:15px;right:22px}
.kicker{font:11px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#c27b97;margin-bottom:18px}
h1{font-size:clamp(30px,7vw,44px);font-weight:normal;line-height:1.18;margin:0 0 18px;color:#a94f75}
p{font-size:18px;line-height:1.7;margin:0;white-space:pre-wrap}.decor{font-size:42px;margin:5px 0 20px}
button{border:0;border-radius:999px;padding:13px 25px;background:var(--deep);color:white;font-size:14px;cursor:pointer;box-shadow:0 7px 18px #d85d8d35;transition:transform .2s}
button:hover{transform:translateY(-2px)}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.progress{display:flex;gap:7px;margin:0 0 24px}.dot{width:7px;height:7px;border-radius:50%;background:#f1d1dd}.dot.active{background:#d85d8d;width:20px;border-radius:10px}
.gift{font-size:88px;cursor:pointer;user-select:none;transition:transform .25s;filter:drop-shadow(0 8px 8px #d85d8d25)}.gift:hover{transform:scale(1.08) rotate(-4deg)}
.hint{font:12px Arial,sans-serif;color:#b47b91;margin-top:12px}.gift-photo{display:block;width:min(100%,300px);max-height:340px;object-fit:contain;margin:18px auto 8px;border-radius:18px;box-shadow:0 8px 24px #c56e8b22}.gift-caption{font-size:25px;color:#a94f75;margin-top:12px;font-style:italic}.hidden{display:none!important}
.fade{animation:fade .55s ease both}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
footer{position:relative;z-index:1;text-align:center;padding:0 12px 18px;color:#c18aa0;font:11px Arial,sans-serif;letter-spacing:1px}
@media(max-width:420px){.card{min-height:440px;padding:28px 22px}p{font-size:17px}}
</style></head>
<body><div id="hearts"></div><main><section class="card" aria-live="polite"><div class="progress" id="progress"></div><div id="content" class="fade"></div></section></main>
<footer>MADE WITH A LITTLE EXTRA LOVE ♡</footer>
